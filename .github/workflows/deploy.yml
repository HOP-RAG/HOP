name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get version from git tag
        id: version
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "v$(date +%Y%m%d-%H%M%S)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Deploy to DigitalOcean
        env:
          DEPLOY_HOST: ${{ secrets.DROPLET_IP }}
          DEPLOY_USER: root
          DEPLOY_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts

          # SSH into droplet and deploy
          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
          set -e
          cd /opt/onyx

          echo "=== Deploying version $VERSION ==="

          # Create pre-deployment backup
          echo "Creating pre-deployment backup..."
          BACKUP_DIR="/opt/onyx/backups"
          mkdir -p $BACKUP_DIR
          BACKUP_TIME=$(date +%Y%m%d-%H%M%S)
          cp docker-compose.yml $BACKUP_DIR/docker-compose.yml.backup-${BACKUP_TIME} || true
          git stash || true  # Save any uncommitted changes

          # Pull latest code
          echo "Pulling latest code..."
          git fetch origin main
          git reset --hard origin/main

          # Ensure docker-compose.yml is symlinked to deployment version
          echo "Ensuring docker-compose.yml is up to date..."
          rm -f docker-compose.yml
          ln -sf deployment/docker_compose/docker-compose.yml docker-compose.yml

          # Pull latest images
          echo "Pulling Docker images..."
          sudo docker compose pull

          # Stop old services with backup
          echo "Stopping services..."
          sudo docker compose down -t 30

          # Clean up any orphaned containers (e.g., old nginx proxy)
          echo "Cleaning up orphaned containers..."
          sudo docker stop onyx-proxy 2>/dev/null || true
          sudo docker rm onyx-proxy 2>/dev/null || true

          # Start new services
          echo "Starting services..."
          sudo docker compose up -d

          # Wait for services
          echo "Waiting for services to start..."
          sleep 15

          # Enhanced health checks with retries
          echo "Running comprehensive health checks..."
          echo "Current running containers:"
          sudo docker compose ps

          max_retries=30
          retry_count=0

          # Check Backend API
          echo "Checking Backend API health..."
          while [ $retry_count -lt $max_retries ]; do
            if curl -s http://localhost:8080/health 2>&1 | grep -q "success.*true\|200"; then
              echo "✓ Backend API is healthy"
              break
            fi
            retry_count=$((retry_count + 1))
            if [ $retry_count -lt $max_retries ]; then
              echo "  Backend not ready yet, retrying... ($retry_count/$max_retries)"
              sleep 2
            fi
          done

          if [ $retry_count -eq $max_retries ]; then
            echo "✗ Backend API health check failed after $max_retries attempts"
            echo "Backend service logs:"
            sudo docker compose logs api_server --tail=100

            # Attempt automatic rollback
            echo ""
            echo "⚠️  Deployment failed. Attempting rollback..."
            LATEST_BACKUP=$(ls -t $BACKUP_DIR/docker-compose.yml.backup-* 2>/dev/null | head -1)
            if [ -n "$LATEST_BACKUP" ]; then
              echo "Restoring from backup: $LATEST_BACKUP"
              cp $LATEST_BACKUP docker-compose.yml
              rm -f docker-compose.yml  # Remove symlink
              cp $LATEST_BACKUP docker-compose.yml
              sudo docker compose down -t 30
              sudo docker compose up -d
              sleep 10
              echo "Rollback completed. Please verify deployment manually."
            fi
            exit 1
          fi

          # Check Frontend
          echo "Checking Frontend health..."
          if curl -s http://localhost:3000 > /dev/null 2>&1; then
            echo "✓ Frontend is responding"
          else
            echo "✗ Frontend health check failed"
            echo "Frontend logs:"
            sudo docker compose logs web_server --tail=50
            exit 1
          fi

          # Check HTTPS
          echo "Checking HTTPS endpoint..."
          if curl -sk https://klugermax.com/health > /dev/null 2>&1 || curl -sk https://klugermax.com > /dev/null 2>&1; then
            echo "✓ HTTPS endpoint is responding"
          else
            echo "⚠️  HTTPS endpoint check failed (may still be initializing)"
          fi

          echo ""
          echo "=== ✅ Deployment successful (version: $VERSION) ==="
          echo "All services are healthy and responding."
          EOF

      - name: Deployment notification
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Deployed to: https://klugermax.com"

      - name: Deployment failed notification
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          exit 1
