name: Deploy to DigitalOcean (Release)

on:
  push:
    branches:
      - "release-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (for example 0.1.0)"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  extract-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Extract version from branch or input
        id: extract
        run: |
          VERSION_INPUT="${{ github.event.inputs.version }}"
          BRANCH="${{ github.ref_name }}"

          if [ -n "$VERSION_INPUT" ] && [ "$VERSION_INPUT" != "latest" ]; then
            VERSION="$VERSION_INPUT"
          else
            VERSION="${BRANCH#release-}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "[OK] Version to deploy: $VERSION"

  build-backend:
    needs: extract-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/hop-rag/activa-backend:${{ needs.extract-version.outputs.version }}
            ghcr.io/hop-rag/activa-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-web:
    needs: extract-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web server image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/hop-rag/activa-web-server:${{ needs.extract-version.outputs.version }}
            ghcr.io/hop-rag/activa-web-server:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: [extract-version, build-backend, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Deploy to DigitalOcean
        env:
          DEPLOY_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DROPLET_IP }}
          DEPLOY_USER: root
          VERSION: ${{ needs.extract-version.outputs.version }}
          BRANCH: ${{ github.ref_name }}
          PREFERRED_DEPLOY_DIR: /opt/hop
          LEGACY_DEPLOY_DIR: /opt/onyx
          PROXY_CONTAINER: hop-proxy
          LEGACY_PROXY_CONTAINER: onyx-proxy
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          if [ -z "$DEPLOY_KEY" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "[ERROR] Missing required secrets: DROPLET_SSH_KEY and DROPLET_IP"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          if ! ssh-keyscan -H -t rsa,ecdsa,ed25519 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "[ERROR] Failed to fetch SSH host key for $DEPLOY_HOST"
            exit 1
          fi

          echo "[INFO] Deploying version $VERSION to DigitalOcean ($DEPLOY_HOST)"
          echo "[INFO] Preferred deployment directory: $PREFERRED_DEPLOY_DIR"
          echo "[INFO] Backward compatibility enabled with: $LEGACY_DEPLOY_DIR"

          ssh \
          -i ~/.ssh/deploy_key \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- \
            "$BRANCH" \
            "$PREFERRED_DEPLOY_DIR" \
            "$LEGACY_DEPLOY_DIR" \
            "$PROXY_CONTAINER" \
            "$LEGACY_PROXY_CONTAINER" \
            "$GHCR_TOKEN" <<'EOSSH'
            BRANCH="$1"
            PREFERRED_DEPLOY_DIR="$2"
            LEGACY_DEPLOY_DIR="$3"
            PROXY_CONTAINER="$4"
            LEGACY_PROXY_CONTAINER="$5"
            GHCR_TOKEN="$6"
            set -e

            if [ -d "$PREFERRED_DEPLOY_DIR" ]; then
              DEPLOY_DIR="$PREFERRED_DEPLOY_DIR"
            elif [ -d "$LEGACY_DEPLOY_DIR" ]; then
              DEPLOY_DIR="$LEGACY_DEPLOY_DIR"
            else
              DEPLOY_DIR="$PREFERRED_DEPLOY_DIR"
              mkdir -p "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR" || exit 1

            echo "[INFO] Updating code from release branch ($BRANCH)..."
            git remote prune origin
            git fetch origin "$BRANCH"
            git checkout -- .
            git checkout "origin/$BRANCH"
            git log -1 --oneline

            echo "[INFO] Refreshing docker-compose.yml from deployment/docker_compose..."
            if [ -f deployment/docker_compose/docker-compose.prod.yml ]; then
              cp deployment/docker_compose/docker-compose.prod.yml docker-compose.yml
            elif [ -f deployment/docker_compose/docker-compose.yml ]; then
              cp deployment/docker_compose/docker-compose.yml docker-compose.yml
            else
              echo "[ERROR] No base compose file found for deployment"
              exit 1
            fi

            echo "[INFO] Validating deployment prerequisites..."
            if [ ! -f nginx-simple.conf ]; then
              echo "[ERROR] Missing nginx-simple.conf in $(pwd)"
              exit 1
            fi
            if [ ! -f docker-compose.yml ]; then
              echo "[ERROR] Missing docker-compose.yml in $(pwd)"
              exit 1
            fi

            echo "[INFO] Logging into GHCR..."
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u github-actions --password-stdin

            echo "[INFO] Pulling Docker images..."
            sudo docker compose pull

            echo "[INFO] Stopping current services..."
            sudo docker compose down --remove-orphans
            sudo docker stop "$LEGACY_PROXY_CONTAINER" 2>/dev/null || true
            sudo docker rm "$LEGACY_PROXY_CONTAINER" 2>/dev/null || true

            sleep 2

            echo "[INFO] Checking nginx-simple.conf state..."
            if [ -d nginx-simple.conf ]; then
              sudo rm -rf nginx-simple.conf
            fi
            if [ ! -f nginx-simple.conf ]; then
              echo "[ERROR] nginx-simple.conf is missing or corrupted"
              exit 1
            fi

            echo "[INFO] Starting ACTIVA services..."
            sudo docker compose up -d

            echo "[INFO] Waiting for services to initialize..."
            sleep 15

            echo "[INFO] Running database migrations..."
            MULTI_TENANT_ENABLED=$(grep -qE '^MULTI_TENANT=true' .env 2>/dev/null && echo "true" || echo "false")

            if [ "$MULTI_TENANT_ENABLED" = "true" ]; then
              echo "[INFO] Multi-tenant mode: running schema_private migrations..."
              sudo docker compose exec -T api_server alembic -n schema_private upgrade head
              echo "[INFO] Multi-tenant mode: running tenant schema migrations..."
              sudo docker compose exec -T api_server alembic -x upgrade_all_tenants=true -x continue=true upgrade head
            else
              echo "[INFO] Single-tenant mode: running standard migrations..."
              sudo docker compose exec -T api_server alembic upgrade head
            fi

            echo "[INFO] Verifying nginx container..."
            if ! sudo docker ps | grep -q "hop-nginx"; then
              echo "[ERROR] nginx container is not running"
              sudo docker ps
              sudo docker logs hop-nginx-1 2>&1 | tail -30 || true
              exit 1
            fi

            echo "[OK] Deployment completed"
          EOSSH

          echo "[OK] Deployment completed in DigitalOcean (version: $VERSION)"

  verify:
    needs: [extract-version, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify deployment
        env:
          DEPLOY_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DROPLET_IP }}
          DEPLOY_USER: root
          PREFERRED_DEPLOY_DIR: /opt/hop
          LEGACY_DEPLOY_DIR: /opt/onyx
          PROXY_CONTAINER: hop-proxy
          LEGACY_PROXY_CONTAINER: onyx-proxy
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          if ! ssh-keyscan -H -t rsa,ecdsa,ed25519 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "[ERROR] Failed to fetch SSH host key for $DEPLOY_HOST"
            exit 1
          fi

          echo "[INFO] Running deployment health checks..."

          ssh \
          -i ~/.ssh/deploy_key \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- \
            "$PREFERRED_DEPLOY_DIR" \
            "$LEGACY_DEPLOY_DIR" \
            "$PROXY_CONTAINER" \
            "$LEGACY_PROXY_CONTAINER" <<'EOSSH'
            PREFERRED_DEPLOY_DIR="$1"
            LEGACY_DEPLOY_DIR="$2"
            PROXY_CONTAINER="$3"
            LEGACY_PROXY_CONTAINER="$4"
            set -e

            if [ -d "$PREFERRED_DEPLOY_DIR" ]; then
              DEPLOY_DIR="$PREFERRED_DEPLOY_DIR"
            elif [ -d "$LEGACY_DEPLOY_DIR" ]; then
              DEPLOY_DIR="$LEGACY_DEPLOY_DIR"
            else
              echo "[ERROR] No valid deployment directory exists"
              exit 1
            fi

            cd "$DEPLOY_DIR" || exit 1

            echo "[INFO] Docker compose status:"
            sudo docker compose ps

            HEALTH_FAILED=0

            echo -n "Backend API: "
            for i in {1..5}; do
              if sudo docker compose exec -T api_server curl -s http://localhost:8080/health >/dev/null 2>&1; then
                echo "ok"
                break
              fi
              if [ $i -lt 5 ]; then
                echo -n "."
                sleep 3
              else
                echo "failed"
                HEALTH_FAILED=1
              fi
            done

            echo -n "PostgreSQL: "
            if sudo docker compose exec -T relational_db pg_isready -U postgres >/dev/null 2>&1; then
              echo "ok"
            else
              echo "failed"
              HEALTH_FAILED=1
            fi

            echo -n "Redis: "
            if sudo docker compose exec -T cache redis-cli ping >/dev/null 2>&1; then
              echo "ok"
            else
              echo "failed"
              HEALTH_FAILED=1
            fi

            echo -n "Proxy nginx: "
            if ! sudo docker ps -a | grep -q "$PROXY_CONTAINER"; then
              echo "not found"
              sudo docker ps -a | grep "$LEGACY_PROXY_CONTAINER" || true
              HEALTH_FAILED=1
            elif ! sudo docker ps | grep -q "$PROXY_CONTAINER"; then
              echo "stopped"
              sudo docker ps -a | grep "$PROXY_CONTAINER" || true
              sudo docker logs "$PROXY_CONTAINER" 2>&1 | tail -20 || true
              HEALTH_FAILED=1
            else
              for i in {1..5}; do
                if curl -s http://localhost/ >/dev/null 2>&1; then
                  echo "ok"
                  break
                fi
                if [ $i -lt 5 ]; then
                  echo -n "."
                  sleep 3
                else
                  echo "no HTTP response"
                  HEALTH_FAILED=1
                fi
              done
            fi

            if [ $HEALTH_FAILED -eq 1 ]; then
              echo "[ERROR] Health checks failed"
              exit 1
            fi

            echo "[OK] All services are operational"
          EOSSH

          echo "[OK] Verification completed"

  tag-deployment:
    needs: [extract-version, deploy, verify]
    if: needs.deploy.result == 'success' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Tag successful deployment
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          TAG="deployed-$VERSION"

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "[INFO] Tag $TAG already exists on remote"
          else
            git tag -a "$TAG" -m "Successfully deployed version: $VERSION" HEAD
            git push origin "$TAG"
            echo "[OK] Created tag: $TAG"
          fi

  auto-rollback:
    needs: [extract-version, deploy, verify]
    if: needs.deploy.result == 'failure' || (needs.deploy.result == 'success' && needs.verify.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Find previous deployed version
        id: prev_version
        run: |
          CURRENT_VERSION="${{ needs.extract-version.outputs.version }}"
          echo "[INFO] Current failed version: $CURRENT_VERSION"

          # Find the most recent deployed-* tag that is NOT the current version.
          # Tags are created by the tag-deployment job on each successful deploy.
          PREV_TAG=$(git tag --list 'deployed-*' --sort=-version:refname \
            | grep -v "deployed-${CURRENT_VERSION}$" \
            | head -n 1)

          if [ -n "$PREV_TAG" ]; then
            PREV_VERSION="${PREV_TAG#deployed-}"
            echo "[INFO] Previous successfully deployed version: $PREV_VERSION (tag: $PREV_TAG)"
          else
            echo "[WARN] No previous deployed-* tag found. Falling back to main."
            PREV_VERSION=""
          fi

          echo "prev_version=$PREV_VERSION" >> "$GITHUB_OUTPUT"

      - name: Auto-rollback to previous version
        env:
          DEPLOY_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DROPLET_IP }}
          DEPLOY_USER: root
          PREFERRED_DEPLOY_DIR: /opt/hop
          LEGACY_DEPLOY_DIR: /opt/onyx
          PROXY_CONTAINER: hop-proxy
          LEGACY_PROXY_CONTAINER: onyx-proxy
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV_VERSION: ${{ steps.prev_version.outputs.prev_version }}
        run: |
          set -e

          echo "[WARN] Deployment verification failed. Starting automatic rollback..."
          if [ -n "$PREV_VERSION" ]; then
            echo "[INFO] Rolling back to previous version: $PREV_VERSION"
          else
            echo "[INFO] No previous version found. Rolling back to main."
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          if ! ssh-keyscan -H -t rsa,ecdsa,ed25519 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "[ERROR] Failed to fetch SSH host key for $DEPLOY_HOST"
            exit 1
          fi

          ssh \
          -i ~/.ssh/deploy_key \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=10 \
          "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- \
            "$PREFERRED_DEPLOY_DIR" \
            "$LEGACY_DEPLOY_DIR" \
            "$PROXY_CONTAINER" \
            "$LEGACY_PROXY_CONTAINER" \
            "$GHCR_TOKEN" \
            "$PREV_VERSION" <<'EOSSH'
            PREFERRED_DEPLOY_DIR="$1"
            LEGACY_DEPLOY_DIR="$2"
            PROXY_CONTAINER="$3"
            LEGACY_PROXY_CONTAINER="$4"
            GHCR_TOKEN="$5"
            PREV_VERSION="$6"
            set -e

            if [ -d "$PREFERRED_DEPLOY_DIR" ]; then
              DEPLOY_DIR="$PREFERRED_DEPLOY_DIR"
            elif [ -d "$LEGACY_DEPLOY_DIR" ]; then
              DEPLOY_DIR="$LEGACY_DEPLOY_DIR"
            else
              echo "[ERROR] No valid deployment directory exists"
              exit 1
            fi

            cd "$DEPLOY_DIR" || exit 1

            echo "[INFO] Current state before rollback:"
            sudo docker compose ps

            # Determine the git ref to roll back to
            if [ -n "$PREV_VERSION" ]; then
              ROLLBACK_BRANCH="release-${PREV_VERSION}"
              echo "[INFO] Rolling back to release branch: $ROLLBACK_BRANCH"
              git fetch origin "$ROLLBACK_BRANCH"
              git checkout -- .
              git checkout "origin/$ROLLBACK_BRANCH"
            else
              echo "[INFO] No previous version — rolling back to main"
              git fetch origin main
              git checkout -- .
              git checkout origin/main
            fi
            git log -1 --oneline

            if [ -f deployment/docker_compose/docker-compose.prod.yml ]; then
              cp deployment/docker_compose/docker-compose.prod.yml docker-compose.yml
            elif [ -f deployment/docker_compose/docker-compose.yml ]; then
              cp deployment/docker_compose/docker-compose.yml docker-compose.yml
            else
              echo "[ERROR] No base compose file found for rollback"
              exit 1
            fi

            sudo docker compose down --remove-orphans
            sudo docker stop "$LEGACY_PROXY_CONTAINER" 2>/dev/null || true
            sudo docker rm "$LEGACY_PROXY_CONTAINER" 2>/dev/null || true

            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u github-actions --password-stdin

            # Pull images for the rollback version
            if [ -n "$PREV_VERSION" ]; then
              echo "[INFO] Pulling images tagged: $PREV_VERSION"
              IMAGE_TAG="$PREV_VERSION" sudo -E docker compose pull
              IMAGE_TAG="$PREV_VERSION" sudo -E docker compose up -d
            else
              sudo docker compose pull
              sudo docker compose up -d
            fi

            sleep 15

            # Skip migrations on rollback — the DB schema is already ahead
            # and the older code is compatible with the newer additive schema.
            echo "[INFO] Skipping migrations on rollback (DB schema is forward-compatible)"

            echo "[OK] Automatic rollback completed"
          EOSSH

  notify:
    needs: [extract-version, deploy, verify, tag-deployment, auto-rollback]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deployment summary
        run: |
          DEPLOY_SUCCESS="${{ needs.deploy.result }}"
          VERIFY_SUCCESS="${{ needs.verify.result }}"
          ROLLBACK_TRIGGERED="${{ needs.auto-rollback.result }}"

          if [ "$DEPLOY_SUCCESS" = "success" ] && [ "$VERIFY_SUCCESS" = "success" ]; then
            echo "[OK] Deployment succeeded. Version: ${{ needs.extract-version.outputs.version }}"
            echo "[INFO] Access: https://klugermax.com"
            echo "[INFO] Tag: deployed-${{ needs.extract-version.outputs.version }}"
          elif [ "$ROLLBACK_TRIGGERED" = "success" ]; then
            PREV_VERSION="${{ needs.auto-rollback.outputs.prev_version || 'main' }}"
            echo "[WARN] Deployment failed verification and automatic rollback was triggered"
            echo "[ERROR] Version ${{ needs.extract-version.outputs.version }} was rolled back to $PREV_VERSION"
            exit 1
          else
            echo "[ERROR] Deployment failed and may require manual intervention"
            exit 1
          fi
